version: '3.8'

services:
  # PostgreSQL 15 Database
  postgres:
    image: postgres:15-alpine
    container_name: chef-eval-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chef_candidates
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chef-eval-network

  # Redis 7 (for ARQ job queue)
  redis:
    image: redis:7-alpine
    container_name: chef-eval-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chef-eval-network

  # Note: MinIO removed - using local filesystem storage
  # For S3-compatible storage, see DEPLOY_VPS.md for MinIO installation instructions

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  chef-eval-network:
    driver: bridge
